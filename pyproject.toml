[project]
name = "dialogbook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Biggels", email = "haackra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aidialog>=0.0.30",
    "ipykernel>=7.3.0",
    "jupyasyncclient>=0.2.14",
    "jupyter-server>=2.21.0",
    "jupywire>=0.1.9",
    "monsterui>=1.0.47",
    "python-fasthtml>=0.14.13",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
